server {
    listen 80;
    root /usr/share/nginx/html;

    # Mesma origem para o navegador: em produção local, CORS não é necessário.
    # $http_host mantém a porta. Com $host, o backend compara `Host: localhost` com
    # `Origin: http://localhost:3000`, conclui que é outra origem e responde 403.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Os arquivos de assets têm hash no nome; o index.html não pode ficar em cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
