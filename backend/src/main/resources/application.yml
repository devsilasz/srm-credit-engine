spring:
  application:
    name: srm-credit-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/srm}
    username: ${SPRING_DATASOURCE_USERNAME:srm}
    password: ${SPRING_DATASOURCE_PASSWORD:srm}
  mvc:
    problemdetails:
      enabled: true
  web:
    locale: pt_BR
    locale-resolver: fixed
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

springdoc:
  api-docs:
    version: openapi_3_0
  # Só os status declarados em cada operação; sem isso, todo @ExceptionHandler vira resposta de todas.
  override-with-generic-response: false

pricing:
  base-rate-monthly: 0.01

fx:
  max-age: PT1H
  refresh-interval: PT10M
  provider-timeout: PT2S
  mock:
    rate: 5.4321
    delay: PT0S
    fail: false
